<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#D52B1E">
    <meta name="description"
        content="Order from The Canadian Chef online: poutine, burgers, maple-glazed chicken and more.">
    <title>The Canadian Chef</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link
        href="https://googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red: #D52B1E;
            --red-dark: #A81F15;
            --red-soft: #FDECEA;
            --cream: #FFF7EC;
            --paper: #FFFFFF;
            --ink: #1E1A17;
            --muted: #6B625B;
            --line: #EADFD2;
            --gold: #F2B134;
            --maple: #C8651B;
            --ok: #1E8E5A;
            --radius: 18px;
            --shadow: 0 10px 30px rgba(60, 30, 10, .12);
            --display: 'Fraunces', Georgia, serif;
            --body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: var(--body);
            color: var(--ink);
            background: var(--cream);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased
        }

        img,
        svg {
            display: block;
            max-width: 100%
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            background: none;
            color: inherit
        }

        a {
            color: inherit
        }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        .wrap {
            width: min(1180px, 100% - 32px);
            margin-inline: auto
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            transition: transform .15s, background .15s, box-shadow .15s;
            text-decoration: none
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn-red {
            background: var(--red);
            color: #fff
        }

        .btn-red:hover {
            background: var(--red-dark)
        }

        .btn-white {
            background: #fff;
            color: var(--red)
        }

        .btn-white:hover {
            box-shadow: var(--shadow)
        }

        .btn-ghost {
            border: 2px solid var(--line);
            background: #fff
        }

        .btn-ghost:hover {
            border-color: var(--red);
            color: var(--red)
        }

        .btn[disabled] {
            opacity: .55;
            cursor: not-allowed
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--red);
            color: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .18)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 68px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-family: var(--display);
            font-weight: 800;
            line-height: 1
        }

        .logo svg {
            width: 34px;
            height: 34px
        }

        .logo span small {
            display: block;
            font-family: var(--body);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: .22em;
            opacity: .85;
            margin-bottom: 2px
        }

        .logo span b {
            font-size: 19px;
            letter-spacing: .02em
        }

        nav.links {
            margin-left: 18px;
            display: flex;
            gap: 4px
        }

        nav.links a {
            padding: 8px 12px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            opacity: .92
        }

        nav.links a:hover {
            background: rgba(255, 255, 255, .16)
        }

        .spacer {
            flex: 1
        }

        .mode-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .16);
            font-size: 13px;
            font-weight: 600;
            max-width: 240px
        }

        .mode-chip span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .mode-chip:hover {
            background: rgba(255, 255, 255, .26)
        }

        .cart-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: #fff;
            color: var(--red);
            font-weight: 700
        }

        .cart-btn .count {
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 99px;
            background: var(--red);
            color: #fff;
            font-size: 12px;
            display: grid;
            place-items: center
        }

        .cart-btn.bump {
            animation: bump .35s
        }

        @keyframes bump {
            40% {
                transform: scale(1.12)
            }
        }

        /* Hero carousel */
        .hero {
            position: relative;
            overflow: hidden;
            color: #fff
        }

        .slides {
            display: flex;
            transition: transform .6s cubic-bezier(.7, 0, .2, 1)
        }

        .slide {
            min-width: 100%;
            min-height: 440px;
            display: flex;
            align-items: center;
            position: relative;
            isolation: isolate
        }

        .slide::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--bg);
            z-index: -2
        }

        .slide::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, .18), transparent 40%), repeating-linear-gradient(135deg, rgba(255, 255, 255, .04) 0 14px, transparent 14px 28px)
        }

        .slide .wrap {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 24px;
            align-items: center;
            padding-block: 48px
        }

        .eyebrow {
            display: inline-block;
            background: rgba(255, 255, 255, .18);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        .slide h1 {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(34px, 5.4vw, 66px);
            line-height: 1.02;
            margin: 16px 0 14px
        }

        .slide p {
            font-size: clamp(16px, 2vw, 19px);
            max-width: 46ch;
            opacity: .95;
            margin-bottom: 26px
        }

        .slide .art {
            font-size: clamp(130px, 22vw, 260px);
            text-align: center;
            filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .28));
            animation: float 5s ease-in-out infinite
        }

        @keyframes float {
            50% {
                transform: translateY(-12px) rotate(-3deg)
            }
        }

        .hero-ctrl {
            position: absolute;
            inset: auto 0 18px 0;
            display: flex;
            justify-content: center;
            gap: 8px
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .5);
            transition: width .25s, background .25s;
            cursor: pointer
        }

        .dot[aria-current="true"] {
            width: 30px;
            background: #fff
        }

        .arrow {
            position: absolute;
            top: 50%;
            translate: 0 -50%;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 22px;
            display: grid;
            place-items: center;
            backdrop-filter: blur(4px)
        }

        .arrow:hover {
            background: rgba(255, 255, 255, .35)
        }

        .arrow.prev {
            left: 12px
        }

        .arrow.next {
            right: 12px
        }

        /* Quick order strip */
        .strip {
            margin-top: -28px;
            position: relative;
            z-index: 5
        }

        .strip .card {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .strip button {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 20px 22px;
            text-align: left;
            border-right: 1px solid var(--line)
        }

        .strip button:last-child {
            border-right: 0
        }

        .strip button:hover {
            background: var(--red-soft)
        }

        .strip .ico {
            font-size: 30px
        }

        .strip b {
            display: block;
            font-size: 16px
        }

        .strip small {
            color: var(--muted)
        }

        /* Menu */
        section {
            padding-block: 56px
        }

        h2.title {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1
        }

        .sub {
            color: var(--muted);
            margin-top: 6px
        }

        .cats {
            position: sticky;
            top: 68px;
            z-index: 20;
            background: var(--cream);
            padding: 14px 0;
            margin-top: 18px;
            border-bottom: 1px solid var(--line)
        }

        .cats .row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px
        }

        .cats .row::-webkit-scrollbar {
            display: none
        }

        .chip {
            flex: none;
            padding: 10px 18px;
            border-radius: 999px;
            background: #fff;
            border: 2px solid var(--line);
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap
        }

        .chip:hover {
            border-color: var(--red)
        }

        .chip[aria-pressed="true"] {
            background: var(--red);
            border-color: var(--red);
            color: #fff
        }

        .search {
            margin-top: 14px;
            position: relative
        }

        .search input {
            width: 100%;
            padding: 13px 18px 13px 44px;
            border-radius: 999px;
            border: 2px solid var(--line);
            font: inherit;
            background: #fff
        }

        .search input:focus {
            outline: none;
            border-color: var(--red)
        }

        .search::before {
            content: "🔍";
            position: absolute;
            left: 16px;
            top: 50%;
            translate: 0 -50%;
            font-size: 15px
        }

        .cat-block {
            margin-top: 34px;
            scroll-margin-top: 190px
        }

        .cat-block h3 {
            font-family: var(--display);
            font-size: 26px;
            margin-bottom: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px
        }

        .item {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(60, 30, 10, .07);
            display: flex;
            flex-direction: column;
            transition: transform .2s, box-shadow .2s
        }

        .item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow)
        }

        .item .pic {
            height: 160px;
            display: grid;
            place-items: center;
            font-size: 76px;
            position: relative;
            background: var(--tint, #FDECEA);
            cursor: pointer;
            overflow: hidden
        }

        .item .pic img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--red);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            padding: 4px 10px;
            border-radius: 99px;
            text-transform: uppercase
        }

        .item .body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1
        }

        .item h4 {
            font-size: 17px;
            line-height: 1.25
        }

        .item p {
            font-size: 13.5px;
            color: var(--muted);
            flex: 1
        }

        .item .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px
        }

        .price {
            font-weight: 800;
            font-size: 16px
        }

        .price small {
            font-weight: 600;
            color: var(--muted);
            font-size: 12px;
            margin-right: 2px
        }

        .add {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--red);
            color: #fff;
            font-size: 24px;
            line-height: 1;
            display: grid;
            place-items: center
        }

        .add:hover {
            background: var(--red-dark);
            transform: scale(1.06)
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted)
        }

        /* Voucher */
        .voucher {
            background: var(--ink);
            color: #fff;
            border-radius: 28px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            overflow: hidden;
            align-items: center
        }

        .voucher .txt {
            padding: clamp(28px, 5vw, 56px)
        }

        .voucher h2 {
            font-family: var(--display);
            font-size: clamp(28px, 4vw, 44px);
            line-height: 1.1;
            margin: 12px 0
        }

        .voucher p {
            opacity: .8;
            margin-bottom: 22px;
            max-width: 44ch
        }

        .voucher .art {
            background: linear-gradient(135deg, var(--red), var(--maple));
            min-height: 260px;
            display: grid;
            place-items: center;
            font-size: 110px;
            height: 100%
        }

        .soon {
            display: inline-block;
            background: var(--gold);
            color: var(--ink);
            font-weight: 700;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 99px;
            margin-left: 8px;
            vertical-align: middle
        }

        /* App download + info */
        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px
        }

        .info .box {
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 10px rgba(60, 30, 10, .07)
        }

        .info h3 {
            font-family: var(--display);
            font-size: 22px;
            margin-bottom: 8px
        }

        .info ul {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 14.5px
        }

        .stores {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .store {
            background: var(--ink);
            color: #fff;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 12px;
            line-height: 1.2;
            text-decoration: none
        }

        .store b {
            display: block;
            font-size: 16px
        }

        footer {
            background: var(--red);
            color: #fff;
            padding: 40px 0 28px
        }
